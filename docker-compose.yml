services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn api.metadata_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - FRAUD_MONGO_URI=mongodb://mongo:27017
      - FRAUD_MONGO_DB=fraud_project
      - FRAUD_MONGO_COLLECTION=customer_profiles
    depends_on:
      - mongo

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: streamlit run dashboards/app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - FRAUD_MONGO_URI=mongodb://mongo:27017
    depends_on:
      - api

volumes:
  mongo_data:
